{% extends "layout/basic.html" %}
{% block content %}
<div class="row">
  <div class="columns">
    <header class="oi33-training-head">
      <div class="oi33-training-head__copy">
        <p class="oi33-training-head__eyebrow">TRAINING</p>
        <h1>训练计划</h1>
        <p>按章节循序练习，把每一次完成都变成看得见的进步。</p>
      </div>
      {% if handler.user.hasPerm(perm.PERM_CREATE_TRAINING) %}
        <a href="{{ url('training_create') }}" class="primary button oi33-training-head__action">
          <span class="icon icon-add" aria-hidden="true"></span> {{ _('New Training Plan') }}
        </a>
      {% endif %}
    </header>

    <div class="oi33-training-catalog">
      <div class="oi33-training-toolbar">
        <div class="oi33-training-toolbar__copy">
          <span class="oi33-training-toolbar__icon icon icon-book" aria-hidden="true"></span>
          <span>
            <strong>找到适合你的计划</strong>
            <small>按计划标题快速筛选</small>
          </span>
        </div>
        <form method="get" class="oi33-training-search filter-form" name="filter-form" role="search">
          <div class="oi33-training-search__field">
            <span class="icon icon-search" aria-hidden="true"></span>
            <input id="oi33-training-query" type="search" class="textbox" name="q" value="{{ q }}" placeholder="搜索计划标题" aria-label="搜索训练计划">
            {% if q %}
              <a href="{{ url('training_main') }}" class="oi33-training-search__clear" aria-label="清除搜索">×</a>
            {% endif %}
          </div>
          <button type="submit" class="primary button oi33-training-search__submit">{{ _('Search') }}</button>
        </form>
      </div>
      {% include "partials/training_list.html" %}
    </div>
  </div>
</div>
{% endblock %}
