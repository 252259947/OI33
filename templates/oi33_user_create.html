{% set page_name = "oi33_user_create" %}
{% extends "layout/basic.html" %}
{% block content %}
<div class="row">
  <div class="medium-9 columns">
    <div class="section">
      <div class="section__header">
        <h1 class="section__title">新建用户</h1>
        <div class="section__tools">
          <a href="{{ url('oi33_admin') }}" class="rounded button">{{ _('Back to Admin') }}</a>
        </div>
      </div>
      <div class="section__body">
        <form method="post" action="{{ url('oi33_admin_user_create') }}">
          <input type="hidden" name="csrfToken" value="{{ handler.csrfToken }}">
          <div class="row" style="margin-bottom:1rem;">
            <div class="medium-4 columns">
              <label>用户名
                <input type="text" name="uname" class="textbox" placeholder="用户名" required autofocus>
              </label>
            </div>
            <div class="medium-4 columns">
              <label>密码
                <input type="password" name="password" class="textbox" placeholder="密码" required>
              </label>
            </div>
            <div class="medium-4 columns">
              <label>邮箱
                <input type="email" name="mail" class="textbox" placeholder="姓名@33dai.cn" required>
              </label>
            </div>
          </div>
          <button type="submit" class="rounded primary button">创建</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
