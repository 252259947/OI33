{% set page_name = 'home_security' %}
{% extends 'layout/basic.html' %}
{% block content %}
<div class="row oi33-enrollment oi33-password-change"><div class="columns">
  <section class="section">
    <div class="section__header"><h1 class="section__title">请先修改密码</h1></div>
    <div class="section__body">
      <p class="oi33-enrollment__muted">你的账号正在使用初始或重置后的临时密码。为保护账号安全，请先设置新密码，再继续使用 OJ。</p>
      <div class="oi33-enrollment__notice">新密码至少 6 个字符，不能使用 123456，也不能与当前密码相同。请勿将密码告诉他人。</div>
      <form method="post" action="{{ url('home_security') }}" class="oi33-enrollment__form" data-enrollment-password-change>
        <input type="hidden" name="csrfToken" value="{{ handler.csrfToken }}">
        <input type="hidden" name="operation" value="change_password">
        <label>{% if sudoUid %}管理员密码{% else %}当前密码{% endif %}<input class="textbox" type="password" name="current" required minlength="6" maxlength="255" autocomplete="current-password"></label>
        <label>新密码<input class="textbox" type="password" name="password" required minlength="6" maxlength="255" autocomplete="new-password"></label>
        <label>确认新密码<input class="textbox" type="password" name="verifyPassword" required minlength="6" maxlength="255" autocomplete="new-password"></label>
        <button class="primary button" type="submit">保存新密码并继续</button>
      </form>
    </div>
  </section>
</div></div>
{% endblock %}
