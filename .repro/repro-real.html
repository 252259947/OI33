<script src="vendor.js"></script>
<script>
(function () {
  const $ = window.jQuery;
  $('.data-table').each(function () {
    const $dom = $(this);
    if ($dom.closest('.section__body').length === 0) return;
    const $container = $('<div>').addClass('section__table-container');
    $container.insertBefore($dom);
    const $header = $('<table>');
    $header.attr('class', `${$dom.attr('class')} section__table-header`);
    $container.append($header).append($dom);
    $header.empty();
    $dom.children('colgroup').clone().appendTo($header);
    $dom.children('thead').appendTo($header);
    const navHeight = $('.nav').height();
    setTimeout(() => $header.stick_in_parent({ parent: $container, offset_top: navHeight }), 0);
  });
  const m = /scroll-(\d+)/.exec(location.hash);
  if (m) window.addEventListener('load', () => setTimeout(() => window.scrollTo(0, +m[1]), 80));
})();
</script>
